name: Publish

on:
  repository_dispatch:
    types: [vortex_extension_update]
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"

jobs:
  get-package-version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    name: Get Package Version
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: get-version
        uses: beaconbrigade/package-json-version@v0.3
        with:
          path: .

  get-changelog-info:
    if: github.ref == 'refs/heads/master'
    name: Get Changelog Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      description: ${{ steps.changelog.outputs.description }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Install and Run ChangelogParser
        id: changelog
        run: |
          dotnet tool install -g Bannerlord.ChangelogParser

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)

          echo "version=$(bannerlord_changelog_parser latestversion -f "$PWD/changelog.txt")" >> $GITHUB_OUTPUT

          echo "description<<$EOF" >> $GITHUB_OUTPUT
          echo "$(bannerlord_changelog_parser description -f "$PWD/changelog.txt")" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
        shell: bash

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.19
          cache: "pnpm"

      # The build publishes tools/Bannerlord.LobbyBridge (net9.0)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: game-mount-and-blade2
          path: dist

  ###########################
  #          SIGN           #
  ###########################
  # Signs Bannerlord.LobbyBridge.dll with the Certum certificate, replacing the artifact with the signed one.
  # Bannerlord.LauncherManager.Native.dll and launchermanager.node come signed from @butr/vortexextensionnative
  sign:
    if: github.ref == 'refs/heads/master' && needs.get-package-version.outputs.version == needs.get-changelog-info.outputs.version
    needs: [get-package-version, get-changelog-info, build-and-test]
    uses: BUTR/workflows/.github/workflows/sign-certum.yml@master
    with:
      artifact_name: game-mount-and-blade2
    secrets:
      CODE_SIGNING_CLIENT_ID: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
      CODE_SIGNING_PRIVATE_KEY: ${{ secrets.CODE_SIGNING_PRIVATE_KEY }}

  # Every binary the extension ships has to be signed, ours and the ones from our dependencies
  verify-signatures:
    name: Verify Signatures
    needs: [sign]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download the signed artifact
        uses: actions/download-artifact@v4
        with:
          name: game-mount-and-blade2
          path: ./dist

      - name: Verify the signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binaries = @(Get-ChildItem -Path ./dist -Recurse -File -Include *.dll, *.exe, *.node)
          if ($binaries.Count -eq 0) { throw "No binaries found in the artifact" }
          $unsigned = @()
          foreach ($binary in $binaries) {
            $signature = Get-AuthenticodeSignature -FilePath $binary.FullName
            if ($signature.Status -eq 'Valid') {
              Write-Host "$($binary.Name) is signed by $($signature.SignerCertificate.Subject)"
            } else {
              Write-Host "::error file=$($binary.Name)::$($binary.Name) isn't signed: $($signature.Status) $($signature.StatusMessage)"
              $unsigned += $binary.Name
            }
          }
          if ($unsigned.Count -gt 0) { throw "Unsigned binaries: $($unsigned -join ', ')" }

  ###########################
  #         GITHUB          #
  ###########################
  publish-on-github:
    if: github.ref == 'refs/heads/master' && needs.get-package-version.outputs.version == needs.get-changelog-info.outputs.version
    needs: [get-package-version, get-changelog-info, build-and-test, sign, verify-signatures]
    uses: BUTR/workflows/.github/workflows/release-github.yml@master
    with:
      mod_id: game-mount-and-blade2
      mod_version: ${{ needs.get-changelog-info.outputs.version }}
      mod_description: ${{ needs.get-changelog-info.outputs.description }}
      artifact_name: game-mount-and-blade2

  ###########################
  #        NEXUSMODS        #
  ###########################
  publish-on-nexusmods:
    if: github.ref == 'refs/heads/master' && needs.get-package-version.outputs.version == needs.get-changelog-info.outputs.version
    needs: [get-package-version, get-changelog-info, build-and-test, sign, verify-signatures]
    uses: BUTR/workflows/.github/workflows/release-nexusmods.yml@master
    with:
      nexusmods_game_id: site
      nexusmods_mod_id: 875
      nexusmods_file_group_id: 1765774
      mod_filename: game-mount-and-blade2
      mod_version: ${{ needs.get-changelog-info.outputs.version }}
      mod_description: ${{ needs.get-changelog-info.outputs.description }}
      artifact_name: game-mount-and-blade2
    secrets:
      NEXUSMODS_APIKEY: ${{ secrets.ARAGAS_NEXUSMODS_API_KEY }}
